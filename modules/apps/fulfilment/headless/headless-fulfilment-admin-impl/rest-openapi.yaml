components:
    schemas:
        Error:
            properties:
                errorCode:
                    description:
                        Internal error code mapping
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    example: Unable to find currency. Currency code should be expressed with
                        3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US
                        Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP Status code
                    example: 404
                    readOnly: true
                    type: integer
            required:
                - errorCode
                - errorDescription
                - message
                - status
            type: object
        Parameter:
            properties:
                key:
                    description:
                        Parameter key
                    example: param1
                    type: string
                value:
                    description:
                        Parameter value
                    example: value1
                    type: object
            type: object
        Request:
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                createDate:
                    example: 2017-07-21
                    format: date
                    type: string
                endDate:
                    example: 2017-07-21
                    format: date
                    type: string
                externalReferenceCode:
                    example: 2017-07-21
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                inputParameters:
                    items:
                        $ref: "#/components/schemas/Parameter"
                    type: array
                outputParameters:
                    items:
                        $ref: "#/components/schemas/Parameter"
                    type: array
                replyTo:
                    example: ""
                    type: string
                startDate:
                    example: 2017-07-21
                    format: date
                    type: string
                tasks:
                    items:
                        $ref: "#/components/schemas/Task"
                    type: array
                type:
                    example: ""
                    type: string
                workflowDefinition:
                    example: ""
                    type: string
                workflowStatusInfo:
                    allOf:
                        - $ref: "#/components/schemas/Status"
                    readOnly: true
            type: object
        Status:
            properties:
                code:
                    format: int32
                    readOnly: true
                    type: integer
                label:
                    example: black
                    type: string
                label_i18n:
                    example: black
                    type: string
            type: object
        Task:
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                createDate:
                    example: 2017-07-21
                    format: date
                    type: string
                endDate:
                    example: 2017-07-21
                    format: date
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                index:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                inputParameters:
                    items:
                        $ref: "#/components/schemas/Parameter"
                    type: array
                outputParameters:
                    items:
                        $ref: "#/components/schemas/Parameter"
                    type: array
                requestId:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                startDate:
                    example: 2017-07-21
                    format: date
                    type: string
                type:
                    example: ""
                    type: string
                workflowStatusInfo:
                    allOf:
                        - $ref: "#/components/schemas/Status"
                    readOnly: true
            type: object
info:
    contact:
        email: team-fulfilment@liferay.com
        name: Fulfilment Team
    description:
        "Liferay Fulfilment Admin API. A Java client JAR is available for use with the group ID 'com.liferay', artifact
        ID 'com.liferay.headless.fulfilment.admin.client', and version '1.0.0'."
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: Liferay Fulfilment Admin API
    version: v1.0
