components:
    schemas:
        LambdaParameter:
            properties:
                io:
                    enum: [in, out]
                    type: string
                name:
                    type: string
                position:
                    minimum: 1
                    type: integer
                type:
                    type: string
                value:
                    type: object
            type: object
        LambdaRequest:
            properties:
                lambdaParameters:
                    items:
                        $ref: "#/components/schemas/LambdaParameter"
                    type: array
            type: object
        LambdaResponse:
            properties:
                properties:
                    additionalProperties:
                        type: object
                    type: object
                    x-json-map: true
            type: object
info:
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: Liferay Object Lambda REST API
    version: v1.0
openapi: 3.0.1
paths:
    "/perform/{id}":
        post:
            operationId: postPerformIdPage
            parameters:
                - in: path
                  explode: false
                  name: id
                  required: true
                  schema:
                      description:
                          The resource Id
                      example: 30130
                      format: int64
                      minimum: 0
                      type: integer
                  style: simple
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  required: false
                  schema:
                      type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LambdaRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/LambdaRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LambdaResponse"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LambdaResponse"
                                type: array
                400:
                    description:
                        Invalid input
                500:
                    content:
                        application/json:
                            schema:
                            type: string
                        application/xml:
                            schema:
                            type: string
                    description:
                        Unexpected error
            tags: ["LambdaResponse"]